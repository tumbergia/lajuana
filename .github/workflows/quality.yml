name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest

  mobile-quality:
    name: Mobile quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile workspace dependencies
        run: |
          for path in apps/mobile packages/mobile_core packages/mobile_domain packages/mobile_mocks packages/mobile_ui; do
            (cd "$path" && flutter pub get)
          done

      - name: Flutter analyze app
        run: cd apps/mobile && flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter analyze packages
        run: |
          for path in packages/mobile_core packages/mobile_domain packages/mobile_mocks packages/mobile_ui; do
            (cd "$path" && flutter analyze --no-fatal-infos --no-fatal-warnings)
          done

      - name: Flutter test app
        run: cd apps/mobile && flutter test
