name: OpenAPI Models Check

on:
  pull_request:
    paths:
      - 'apps/api/app/schemas/**'
      - 'apps/api/openapi.json'
      - 'packages/mobile_domain/lib/src/gen/**'
      - 'tools/openapi_gen/**'
      - '.github/workflows/openapi-gen-check.yml'

concurrency:
  group: openapi-gen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check generated Dart models
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend + tool dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
          pip install -r tools/openapi_gen/requirements.txt

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Generate OpenAPI spec + Dart models
        run: |
          cd apps/api
          python -c "from app.main import app; import json; json.dump(app.openapi(), open('openapi.json', 'w'), indent=2)"
          cd ../..
          python tools/openapi_gen/generate_models.py \
            --spec-file apps/api/openapi.json

      - name: Check for uncommitted generated changes
        run: |
          if ! git diff --quiet -- apps/api/openapi.json packages/mobile_domain/lib/src/gen/; then
            echo "-----------------------------------------------------"
            echo "OpenAPI spec or Dart models are out of date!"
            echo "Regenerate apps/api/openapi.json, then run:"
            echo "python tools/openapi_gen/generate_models.py --spec-file apps/api/openapi.json"
            echo "-----------------------------------------------------"
            git diff -- apps/api/openapi.json packages/mobile_domain/lib/src/gen/
            exit 1
          fi

      - name: Analyze generated models
        run: |
          cd packages/mobile_domain
          dart pub get
          dart analyze lib/src/gen/
