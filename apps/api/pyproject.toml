[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "la-juana-api"
version = "0.1.0"
description = "Backend FastAPI de La Juana"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115.0,<1.0.0",
	"uvicorn[standard]>=0.30.0,<1.0.0",
	"pydantic-settings>=2.4.0,<3.0.0",
    "pymongo>=4.0.0,<5.0.0",
    "beanie>=1.0.0,<2.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "PyJWT>=2.9.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0.0,<9.0.0",
	"ruff>=0.6.0,<1.0.0",
	"mypy>=1.11.0,<2.0.0",
	"httpx>=0.27.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
