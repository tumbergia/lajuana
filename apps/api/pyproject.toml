[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "la-juana-api"
version = "0.1.0"
description = "Backend FastAPI de La Juana"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115.0,<1.0.0",
	"uvicorn[standard]>=0.30.0,<1.0.0",
	"pydantic-settings>=2.4.0,<3.0.0",
	"pymongo>=4.0.0,<5.0.0",
	"beanie>=1.0.0,<2.0.0",
	"bcrypt>=4.1.0,<5.0.0",
	"PyJWT>=2.9.0,<3.0.0",
	"email-validator>=2.2.0,<3.0.0",
	"google-genai>=1.0.0,<3.0.0",
	"httpx>=0.27.0,<1.0.0",
	"mcp>=1.13.0,<2.0.0",
	"boto3>=1.34.0,<2.0.0",
	"tzdata>=2024.0,<2026.0",
	"aiosmtplib>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0.0,<9.0.0",
	"pytest-asyncio>=0.24.0,<1.0.0",
	"ruff>=0.6.0,<1.0.0",
	"mypy>=1.11.0,<2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/docs.py" = ["E501"]
"app/api/business_errors.py" = ["E501"]
"app/seed_schedules_2026_q2.py" = ["E501"]
"app/seed_experiences_and_schedules_qa.py" = ["E501"]
"app/migrations/seed_notification_templates.py" = ["E501"]
"app/ai/assistant/prompts/planner.py" = ["E501"]
"app/ai/mcp/tool_contracts.py" = ["E501"]
"app/ai/mcp/tools/reservation_draft.py" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
	"tests/",
	"app/seed_",
	"app/migrations/",
]
[[tool.mypy.overrides]]
module = [
	"app.api.*",
	"app.core.*",
	"app.services.sync_service",
	"app.services.mappers",
	"app.services.reservation_service",
	"app.services.participant_service",
	"app.services.assignment_service",
	"app.services.payment_proof_service",
	"app.ai.mcp.tools.analytics",
	"app.ai.mcp.tools.operations",
	"app.ai.mcp.tools.automations",
	"app.ai.mcp.tools.reservation_draft",
	"app.ai.providers.gemini_provider",
	"app.ai.assistant.*",
	"app.conversations.*",
]
ignore_errors = true
