[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "la-juana-api"
version = "0.1.0"
description = "Backend FastAPI de La Juana"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115.0,<1.0.0",
	"uvicorn[standard]>=0.30.0,<1.0.0",
	"pydantic-settings>=2.4.0,<3.0.0",
	"pymongo>=4.0.0,<5.0.0",
	"beanie>=1.0.0,<2.0.0",
	"bcrypt>=4.1.0,<5.0.0",
	"PyJWT>=2.9.0,<3.0.0",
	"email-validator>=2.2.0,<3.0.0",
	"google-genai>=1.0.0,<3.0.0",
	"httpx>=0.27.0,<1.0.0",
	"mcp>=1.13.0,<2.0.0",
	"boto3>=1.34.0,<2.0.0",
	"tzdata>=2024.0,<2026.0",
	"aiosmtplib>=3.0.0,<4.0.0",
	"langdetect>=1.0.9,<2.0.0",
	"cryptography>=48.0.0",
	"faster-whisper>=1.0.0,<2.0.0",
	"openpyxl>=3.1.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0.0,<9.0.0",
	"pytest-asyncio>=0.24.0,<1.0.0",
	"ruff>=0.6.0,<1.0.0",
	"mypy>=1.11.0,<2.0.0",
	"mongomock>=4.0.0,<6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["storage*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
	"fastapi.Depends",
	"fastapi.Query",
	"fastapi.Path",
	"fastapi.Body",
	"fastapi.Header",
	"fastapi.Cookie",
	"fastapi.File",
	"fastapi.Form",
	"fastapi.Security",
	"Depends",
	"Query",
	"Path",
	"Body",
	"Header",
	"Cookie",
	"File",
	"Form",
	"Security",
	"HTTPBearer",
]

[tool.ruff.lint.per-file-ignores]
"app/api/docs.py" = ["E501"]
"app/api/business_errors.py" = ["E501"]
"app/migrations/seed_notification_templates.py" = ["E501"]
"app/ai/assistant/prompts/planner.py" = ["E501"]
"app/ai/assistant/planner.py" = ["E501"]
"app/ai/assistant/orchestrator.py" = ["E501"]
"app/ai/assistant/response_composer.py" = ["E501"]
"app/ai/mcp/tool_contracts.py" = ["E501"]
"app/ai/mcp/tools/reservation_draft.py" = ["E501"]
"tests/*" = ["E501", "B011", "F841"]
"app/ai/language/messages.py" = ["E501"]
"app/documents/equine_document.py" = ["E402"]
"app/services/analytics_query_service.py" = ["E402", "E501"]
"app/services/mappers.py" = ["E731"]
"app/api/endpoints/*" = ["E501", "B008"]
"app/ai/**" = ["E501", "B005"]
"app/services/analytics_analysis.py" = ["E501"]
"app/channels/**" = ["E501"]
"app/conversations/**" = ["E501"]
"app/services/notification_service.py" = ["E501"]
"app/services/participant_form_link_service.py" = ["E501"]
"app/services/file_upload_service.py" = ["E501", "B904"]
"app/services/storage.py" = ["E501", "B904"]
"app/services/assignment_service.py" = ["F841"]
"app/api/endpoints/whatsapp.py" = ["E501", "B008", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
	"integration: Tests that require a real MongoDB.",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
	"tests/",
	"scripts/",
	"app/seed_",
	"app/cli/",
	"app/migrations/",
]
[[tool.mypy.overrides]]
module = [
	"app.api.*",
	"app.core.*",
	"app.services.sync_service",
	"app.services.mappers",
	"app.services.reservation_service",
	"app.services.participant_service",
	"app.services.assignment_service",
	"app.services.payment_proof_service",
	"app.ai.mcp.tools.analytics",
	"app.ai.mcp.tools.operations",
	"app.ai.mcp.tools.automations",
	"app.ai.mcp.tools.reservation_draft",
	"app.ai.providers.gemini_provider",
	"app.ai.assistant.*",
	"app.conversations.*",
]
ignore_errors = true
