services:
  api:
    image: ${LAJUANA_API_IMAGE:?Set LAJUANA_API_IMAGE to an immutable image tag}
    restart: unless-stopped
    env_file:
      - ${LAJUANA_ENV_FILE:-.env.production}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - api-storage:/app/storage

volumes:
  api-storage:
